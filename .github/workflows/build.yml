name: Build Wt SSH Manager

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore projects
        run: |
          dotnet restore wt-ssh-manager/WtSshManager.csproj
          dotnet restore wt-ssh-manager.tests/WtSshManager.StoreTests.csproj

      - name: Build manager and runner
        run: dotnet build wt-ssh-manager/WtSshManager.csproj -c Release --no-restore -p:NuGetAudit=false

      - name: Run store and ConPTY tests
        run: dotnet run --project wt-ssh-manager.tests/WtSshManager.StoreTests.csproj -c Release --no-restore -p:NuGetAudit=false

      - name: Check terminal frontend
        shell: pwsh
        run: node --check wt-ssh-manager/TerminalUi/terminal.js

      - name: Publish application
        run: dotnet publish wt-ssh-manager/WtSshManager.csproj -c Release --no-restore -o artifacts/wt-ssh-manager -p:NuGetAudit=false

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: wt-ssh-manager
          path: artifacts/wt-ssh-manager

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download published application
        uses: actions/download-artifact@v4
        with:
          name: wt-ssh-manager
          path: artifacts/wt-ssh-manager

      - name: Package release archive
        shell: pwsh
        run: Compress-Archive -Path artifacts/wt-ssh-manager/* -DestinationPath "artifacts/wt-ssh-manager-${{ github.ref_name }}.zip"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/wt-ssh-manager-${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

