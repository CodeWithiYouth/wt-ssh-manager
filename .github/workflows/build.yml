name: Build Wt SSH Manager

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore projects
        run: |
          dotnet restore wt-ssh-manager/WtSshManager.csproj
          dotnet restore wt-ssh-manager.tests/WtSshManager.StoreTests.csproj

      - name: Build manager and runner
        run: dotnet build wt-ssh-manager/WtSshManager.csproj -c Release --no-restore -p:NuGetAudit=false

      - name: Run store and ConPTY tests
        run: dotnet run --project wt-ssh-manager.tests/WtSshManager.StoreTests.csproj -c Release --no-restore -p:NuGetAudit=false

      - name: Check terminal frontend
        shell: pwsh
        run: |
          node --check wt-ssh-manager/TerminalUi/vendor/xterm.js
          node --check wt-ssh-manager/TerminalUi/terminal.js

      - name: Publish application
        run: dotnet publish wt-ssh-manager/WtSshManager.csproj -c Release --no-restore -o artifacts/wt-ssh-manager -p:NuGetAudit=false

      - name: Organize published files
        shell: pwsh
        run: |
          $publishPath = "artifacts/wt-ssh-manager"
          $keepDirectories = @(
            "askpass",
            "Assets",
            "TerminalUi",
            "Microsoft.UI.Xaml",
            "en-us",
            "zh-CN"
          )

          $localizedDirectories = Get-ChildItem -LiteralPath $publishPath -Directory |
            Where-Object {
              $keepDirectories -notcontains $_.Name -and
              $_.Name -match '^[A-Za-z]{2,3}(-[A-Za-z0-9]+)+$'
            }
          foreach ($directory in $localizedDirectories) {
            Remove-Item -LiteralPath $directory.FullName -Recurse -Force
          }

          $symbolFiles = Get-ChildItem -LiteralPath $publishPath -Recurse -File -Filter "*.pdb"
          foreach ($symbolFile in $symbolFiles) {
            Remove-Item -LiteralPath $symbolFile.FullName -Force
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: wt-ssh-manager
          path: artifacts/wt-ssh-manager

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download published application
        uses: actions/download-artifact@v4
        with:
          name: wt-ssh-manager
          path: artifacts/wt-ssh-manager

      - name: Package release archive
        shell: pwsh
        run: |
          $packageRoot = "artifacts/package"
          $appRoot = Join-Path $packageRoot "app"
          New-Item -ItemType Directory -Force -Path $appRoot | Out-Null
          Copy-Item -Path "artifacts/wt-ssh-manager/*" -Destination $appRoot -Recurse -Force

          @"
          Wt SSH Manager ${{ github.ref_name }}

          Run app\WtSshManager.exe.
          Keep the app directory together; its DLLs and resource files are required by the self-contained WinUI application.
          "@ | Set-Content -Path (Join-Path $packageRoot "README.txt") -Encoding utf8

          Compress-Archive `
            -Path "$packageRoot/*" `
            -DestinationPath "artifacts/wt-ssh-manager-${{ github.ref_name }}.zip"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/wt-ssh-manager-${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

